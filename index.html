<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Canvas 祈祷与寄语</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            background-color: #f5f2eb; /* 牛皮纸底色 */
        }

        #app-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* 覆盖在Canvas上方的透明输入框，适配深色主题 */
        /* 覆盖在Canvas上方的透明输入框，适配浅色主题 */
        #prayerInput {
            position: absolute;
            background: transparent;
            border: none;
            outline: none;
            color: #4a3f35; /* 深褐色文字 */
            font-size: 16px;
            font-family: inherit;
            line-height: 1.8;
            resize: none;
            padding: 20px;
            box-sizing: border-box;
            z-index: 10;
            display: none; 
        }

        #prayerInput::placeholder {
            color: rgba(74, 63, 53, 0.4); /* 深褐色占位符 */
        }
    </style>
</head>
<body>

    <div id="app-container">
        <canvas id="mainCanvas"></canvas>
        <textarea id="prayerInput" placeholder="亲爱的天父，我今天遇到了一些烦恼..."></textarea>
    </div>

    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const inputField = document.getElementById('prayerInput');

        let width, height;
        let dpr = window.devicePixelRatio || 1;

        // 状态管理
        let currentState = 0; 
        let transitionAlpha = 0; 
        let fadeDirection = 0; 

        // UI 元素边界
        let btnBounds = { x: 0, y: 0, w: 0, h: 0 };
        let inputBounds = { x: 0, y: 0, w: 0, h: 0 };

        let warningMessage = "";
        let warningTimer = 0;

        // 上帝寄语数据
        let currentVerse = null;
        const bibleVerses = [
            { text: "应当一无挂虑，只要凡事藉着祷告、祈求和感谢，将你们所要的告诉神。神所赐出人意外的平安，必在基督耶稣里保守你们的心怀意念。", ref: "——《腓立比书》 4:6-7" },
            { text: "凡劳苦担重担的人，可以到我这里来，我就使你们得安息。", ref: "——《马太福音》 11:28" },
            { text: "我留下平安给你们，我将我的平安赐给你们。我所赐的，不像世人所赐的。你们心里不要忧愁，也不要胆怯。", ref: "——《约翰福音》 14:27" },
            { text: "神是我们的避难所，是我们的力量，是我们在患难中随时的帮助。", ref: "——《诗篇》 46:1" },
            { text: "你要专心仰赖耶和华，不可倚靠自己的聪明，在你一切所行的事上都要认定他，他必指引你的路。", ref: "——《箴言》 3:5-6" },
            { text: "你们要将一切的忧虑卸给神，因为他顾念你们。", ref: "——《彼得前书》 5:7" },
            { text: "疲乏的，他赐能力；软弱的，他加力量。", ref: "——《以赛亚书》 40:29" }
        ];

        let particles = [];
        let stars = [];
        const numParticles = 30;
        const numStars = 150;

        function initEnvironment() {
            particles = [];
            stars = [];
            
            // 初始化背景飘落的花粉/光斑
            for (let i = 0; i < numStars; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    r: Math.random() * 2 + 0.5,
                    alpha: Math.random() * 0.5 + 0.1,
                    twinkleSpeed: Math.random() * 0.02 + 0.01,
                    vy: Math.random() * 0.2 + 0.1 // 微微下落
                });
            }

            // 初始化萤火虫/光点 (祈祷的具象化，改为牛皮纸+浅绿柔和色彩)
            const colors = ['#ffffff', '#f4e8c1', '#e2e6d5', '#d1d6c3'];
            for (let i = 0; i < numParticles; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    r: Math.random() * 2 + 1,
                    vy: -(Math.random() * 0.4 + 0.2), // 缓慢上升
                    vx: 0,
                    baseX: Math.random() * width,
                    angle: Math.random() * Math.PI * 2,
                    speed: Math.random() * 0.02 + 0.01,
                    alpha: Math.random() * 0.6 + 0.2,
                    color: colors[Math.floor(Math.random() * colors.length)]
                });
            }
        }

        function drawTopDecoration() {
            // 1. 绘制四周复古细线边框，增强信笺质感
            ctx.strokeStyle = 'rgba(107, 119, 90, 0.15)'; // 淡复古灰绿
            ctx.lineWidth = 1;
            ctx.strokeRect(20, 20, width - 40, height - 40);
            
            // 四角装饰短线
            ctx.beginPath();
            // 左上角
            ctx.moveTo(15, 30); ctx.lineTo(15, 15); ctx.lineTo(30, 15);
            // 右上角
            ctx.moveTo(width - 30, 15); ctx.lineTo(width - 15, 15); ctx.lineTo(width - 15, 30);
            // 右下角
            ctx.moveTo(width - 15, height - 30); ctx.lineTo(width - 15, height - 15); ctx.lineTo(width - 30, height - 15);
            // 左下角
            ctx.moveTo(30, height - 15); ctx.lineTo(15, height - 15); ctx.lineTo(15, height - 30);
            ctx.stroke();

            // 2. 绘制顶部中心的橄榄枝 (象征平安与希望)
            ctx.save();
            ctx.translate(width / 2, 45); // 顶部居中

            ctx.strokeStyle = 'rgba(107, 119, 90, 0.6)'; 
            ctx.fillStyle = 'rgba(107, 119, 90, 0.45)';
            ctx.lineWidth = 1.2;

            // 中心四芒星 (象征指引的光)
            ctx.beginPath();
            ctx.moveTo(0, -10);
            ctx.lineTo(2, -2);
            ctx.lineTo(10, 0);
            ctx.lineTo(2, 2);
            ctx.lineTo(0, 10);
            ctx.lineTo(-2, 2);
            ctx.lineTo(-10, 0);
            ctx.lineTo(-2, -2);
            ctx.closePath();
            ctx.fill();

            // 绘制叶子的闭包函数
            function drawLeaf(x, y, angle, scale) {
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(angle);
                ctx.scale(scale, scale);
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.quadraticCurveTo(6, -6, 16, 0); // 叶片上沿
                ctx.quadraticCurveTo(6, 6, 0, 0);   // 叶片下沿
                ctx.fill();
                ctx.restore();
            }

            // --- 左侧枝叶 ---
            ctx.beginPath();
            ctx.moveTo(-15, 0);
            ctx.quadraticCurveTo(-90, -25, -160, 15);
            ctx.stroke();

            // 外侧叶子
            drawLeaf(-40, -11, Math.PI + Math.PI/6, 0.8);
            drawLeaf(-80, -16, Math.PI + Math.PI/5, 1.0);
            drawLeaf(-120, -11, Math.PI + Math.PI/4, 0.8);
            drawLeaf(-156, 12, Math.PI - Math.PI/8, 0.7); // 枝尖
            // 内侧叶子
            drawLeaf(-60, -12, Math.PI - Math.PI/6, 0.6); 
            drawLeaf(-100, -10, Math.PI - Math.PI/5, 0.6);

            // --- 右侧枝叶 ---
            ctx.beginPath();
            ctx.moveTo(15, 0);
            ctx.quadraticCurveTo(90, -25, 160, 15);
            ctx.stroke();

            // 外侧叶子
            drawLeaf(40, -11, -Math.PI/6, 0.8);
            drawLeaf(80, -16, -Math.PI/5, 1.0);
            drawLeaf(120, -11, -Math.PI/4, 0.8);
            drawLeaf(156, 12, Math.PI/8, 0.7); // 枝尖
            // 内侧叶子
            drawLeaf(60, -12, Math.PI/6, 0.6); 
            drawLeaf(100, -10, Math.PI/5, 0.6);

            ctx.restore();
        }

        function updateAndDrawEnvironment() {
            // 绘制牛皮纸融入复古绿的渐变背景
            let bgGradient = ctx.createLinearGradient(0, 0, 0, height);
            bgGradient.addColorStop(0, "#f5f2eb"); // 顶部：牛皮纸亮部
            bgGradient.addColorStop(0.6, "#e8e4d9"); // 中部：温和的纸张色
            bgGradient.addColorStop(1, "#c9d1bd"); // 底部：淡淡的复古灰绿
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, width, height);

            // 调用新增的边框与橄榄枝装饰
            drawTopDecoration();

            // 绘制悬浮花粉/光斑
            stars.forEach(star => {
                star.y += star.vy;
                if(star.y > height) star.y = -10; // 循环落下

                star.alpha += Math.sin(Date.now() * star.twinkleSpeed) * 0.01;
                if(star.alpha > 0.6) star.alpha = 0.6;
                if(star.alpha < 0.1) star.alpha = 0.1;
                
                ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
                ctx.fill();
            });

            // 绘制上升的发光粒子
            particles.forEach(p => {
                p.y += p.vy;
                p.angle += p.speed;
                p.x = p.baseX + Math.sin(p.angle) * 20; // 左右摇摆
                
                // 边界重置
                if (p.y < -20) {
                    p.y = height + 20;
                    p.baseX = Math.random() * width;
                }

                // 发光效果
                ctx.shadowBlur = 15;
                ctx.shadowColor = p.color;
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.alpha;
                
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fill();
            });
            
            // 重置状态
            ctx.shadowBlur = 0;
            ctx.globalAlpha = 1.0; 
        }

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
            
            canvas.style.width = `${width}px`;
            canvas.style.height = `${height}px`;

            // 计算UI布局 (居中，增大一点输入区域)
            const boxWidth = Math.min(width * 0.88, 640);
            const boxHeight = 220;
            const startY = height / 2 - 80;

            inputBounds = {
                x: (width - boxWidth) / 2,
                y: startY,
                w: boxWidth,
                h: boxHeight
            };

            inputField.style.left = `${inputBounds.x}px`;
            inputField.style.top = `${inputBounds.y}px`;
            inputField.style.width = `${inputBounds.w}px`;
            inputField.style.height = `${inputBounds.h}px`;

            if (particles.length === 0) {
                initEnvironment();
            }
        }
        window.addEventListener('resize', resize);

        // 绘制带边框和半透明效果的玻璃态圆角矩形
        function drawGlassRect(x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.arcTo(x + w, y, x + w, y + r, r);
            ctx.lineTo(x + w, y + h - r);
            ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
            ctx.lineTo(x + r, y + h);
            ctx.arcTo(x, y + h, x, y + h - r, r);
            ctx.lineTo(x, y + r);
            ctx.arcTo(x, y, x + r, y, r);
            ctx.closePath();

            // 浅色玻璃背景填充
            ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
            ctx.fill();
            
            // 玻璃高光边框
            ctx.lineWidth = 1;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.stroke();

            // 内阴影/高光渐变增强立体感
            let grad = ctx.createLinearGradient(x, y, x, y + h * 0.5);
            grad.addColorStop(0, 'rgba(255, 255, 255, 0.6)');
            grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
            ctx.fillStyle = grad;
            ctx.fill();
        }

        function wrapText(context, text, x, y, maxWidth, lineHeight) {
            let words = text.split('');
            let line = '';
            let currentY = y;

            for(let n = 0; n < words.length; n++) {
                let testLine = line + words[n];
                let metrics = context.measureText(testLine);
                let testWidth = metrics.width;
                if (testWidth > maxWidth && n > 0) {
                    context.fillText(line, x, currentY);
                    line = words[n];
                    currentY += lineHeight;
                } else {
                    line = testLine;
                }
            }
            context.fillText(line, x, currentY);
            return currentY + lineHeight;
        }

        function drawInputScreen() {
            ctx.textAlign = 'center';
            
            // 主标题 - 深褐色
            ctx.fillStyle = '#4a3f35'; 
            ctx.font = '300 32px "PingFang SC", sans-serif';
            ctx.fillText("倾诉你的心声", width / 2, inputBounds.y - 70);

            // 副标题
            ctx.fillStyle = '#6e5c4f';
            ctx.font = '15px sans-serif';
            ctx.fillText("将你的重担、疑惑与烦恼交托于此...", width / 2, inputBounds.y - 30);

            // 绘制玻璃态输入框背景
            drawGlassRect(inputBounds.x, inputBounds.y, inputBounds.w, inputBounds.h, 16);

            // 绘制祷告按钮 (带呼吸光效)
            const btnW = 180;
            const btnH = 54;
            btnBounds = {
                x: width / 2 - btnW / 2,
                y: inputBounds.y + inputBounds.h + 50,
                w: btnW,
                h: btnH
            };
            
            // 计算呼吸效果 (0 到 1 之间循环)
            const time = Date.now() * 0.002;
            const breath = (Math.sin(time) + 1) / 2;
            
            // 按钮发光阴影 (复古绿阴影)
            ctx.shadowColor = `rgba(147, 158, 130, ${0.4 + breath * 0.3})`;
            ctx.shadowBlur = 15 + breath * 10;
            
            // 按钮渐变背景 (复古灰绿)
            let btnGrad = ctx.createLinearGradient(btnBounds.x, btnBounds.y, btnBounds.x, btnBounds.y + btnBounds.h);
            btnGrad.addColorStop(0, '#939e82'); // 浅复古绿
            btnGrad.addColorStop(1, '#6b775a'); // 深复古绿

            ctx.beginPath();
            ctx.roundRect ? ctx.roundRect(btnBounds.x, btnBounds.y, btnBounds.w, btnBounds.h, 27) : ctx.rect(btnBounds.x, btnBounds.y, btnBounds.w, btnBounds.h); // Fallback
            ctx.fillStyle = btnGrad;
            ctx.fill();
            ctx.shadowBlur = 0; // 重置阴影

            // 按钮文字
            ctx.fillStyle = '#ffffff';
            ctx.font = '500 20px sans-serif';
            ctx.textBaseline = 'middle';
            ctx.fillText("虔诚祷告", width / 2, btnBounds.y + btnBounds.h / 2);
            ctx.textBaseline = 'alphabetic';

            // 错误提示
            if (warningMessage && warningTimer > 0) {
                ctx.fillStyle = `rgba(252, 165, 165, ${Math.min(1, warningTimer / 30)})`;
                ctx.font = '14px sans-serif';
                ctx.fillText(warningMessage, width / 2, btnBounds.y + btnBounds.h + 35);
                warningTimer--;
            }
        }

        function drawResponseScreen() {
            ctx.textAlign = 'center';
            
            let titleY = height / 2 - 140;
            
            ctx.fillStyle = '#4a3f35';
            ctx.font = '300 32px sans-serif';
            ctx.fillText("上帝的寄语", width / 2, titleY);

            ctx.fillStyle = '#6e5c4f';
            ctx.font = '15px sans-serif';
            ctx.fillText("孩子，你的声音已被听见。这是为你准备的话语：", width / 2, titleY + 40);

            // 绘制经文玻璃面板
            let panelW = Math.min(width * 0.88, 640);
            let panelH = 220;
            let panelX = (width - panelW) / 2;
            let panelY = titleY + 70;
            drawGlassRect(panelX, panelY, panelW, panelH, 16);

            // 绘制经文文字
            if (currentVerse) {
                ctx.fillStyle = '#4a3f35'; // 深褐文字
                ctx.font = '300 20px "PingFang SC", sans-serif';
                ctx.textAlign = 'left';
                
                // 行高增加到 36，使排版更舒展
                let endY = wrapText(ctx, currentVerse.text, panelX + 35, panelY + 60, panelW - 70, 36);

                // 绘制出处
                ctx.fillStyle = '#6b775a'; // 采用复古绿作为点缀
                ctx.font = 'italic 16px sans-serif';
                ctx.textAlign = 'right';
                ctx.fillText(currentVerse.ref, panelX + panelW - 35, endY + 25);
            }

            // 返回按钮 (半透明玻璃风格)
            const btnW = 140;
            const btnH = 48;
            btnBounds = {
                x: width / 2 - btnW / 2,
                y: panelY + panelH + 50,
                w: btnW,
                h: btnH
            };
            
            ctx.beginPath();
            ctx.roundRect ? ctx.roundRect(btnBounds.x, btnBounds.y, btnBounds.w, btnBounds.h, 24) : ctx.rect(btnBounds.x, btnBounds.y, btnBounds.w, btnBounds.h);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.fill();
            ctx.lineWidth = 1;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.stroke();
            
            ctx.fillStyle = '#6b775a';
            ctx.font = '16px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText("返 回", width / 2, btnBounds.y + btnBounds.h / 2);
            ctx.textBaseline = 'alphabetic';
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);

            updateAndDrawEnvironment();

            // 状态逻辑处理
            if (currentState === 0) {
                inputField.style.display = 'block';
                drawInputScreen();
            } else if (currentState === 2) {
                inputField.style.display = 'none';
                drawResponseScreen();
            }

            // 处理过渡动画 (采用浅色渐变过渡，保持春日氛围)
            if (currentState === 1) {
                inputField.style.display = 'none'; 
                transitionAlpha += 0.03 * fadeDirection;
                
                if (fadeDirection === 1) drawInputScreen();
                else drawResponseScreen();

                // 覆盖遮罩层 (牛皮纸底色)
                ctx.fillStyle = `rgba(245, 242, 235, ${transitionAlpha})`;
                ctx.fillRect(0, 0, width, height);

                // 完全遮挡，切换数据
                if (transitionAlpha >= 1 && fadeDirection === 1) {
                    fadeDirection = -1;
                    currentVerse = bibleVerses[Math.floor(Math.random() * bibleVerses.length)];
                }

                // 过渡结束
                if (transitionAlpha <= 0 && fadeDirection === -1) {
                    currentState = 2;
                    transitionAlpha = 0;
                }
            }

            // 从2回退到0的动画
            if (currentState === 3) {
                transitionAlpha += 0.04 * fadeDirection;
                if (fadeDirection === 1) drawResponseScreen();
                else drawInputScreen();

                ctx.fillStyle = `rgba(245, 242, 235, ${transitionAlpha})`;
                ctx.fillRect(0, 0, width, height);

                if (transitionAlpha >= 1 && fadeDirection === 1) {
                    fadeDirection = -1;
                    inputField.value = ""; 
                }

                if (transitionAlpha <= 0 && fadeDirection === -1) {
                    currentState = 0;
                    transitionAlpha = 0;
                }
            }

            requestAnimationFrame(animate);
        }

        function handleInteraction(e) {
            let clientX, clientY;
            if (e.type.includes('touch')) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            const rect = canvas.getBoundingClientRect();
            const x = clientX - rect.left;
            const y = clientY - rect.top;

            function isInsideBtn() {
                return x >= btnBounds.x && x <= btnBounds.x + btnBounds.w &&
                       y >= btnBounds.y && y <= btnBounds.y + btnBounds.h;
            }

            if (currentState === 0 && isInsideBtn()) {
                if (inputField.value.trim() === "") {
                    warningMessage = "请倾吐你的心声，哪怕只是一个词...";
                    warningTimer = 150; 
                } else {
                    currentState = 1;
                    fadeDirection = 1; 
                    transitionAlpha = 0;
                }
            } else if (currentState === 2 && isInsideBtn()) {
                currentState = 3; 
                fadeDirection = 1;
                transitionAlpha = 0;
            }
        }

        canvas.addEventListener('mousedown', handleInteraction);
        canvas.addEventListener('touchstart', handleInteraction, {passive: true});

        // 启动应用 (兼容旧版浏览器的 roundRect)
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
                if (w < 2 * r) r = w / 2;
                if (h < 2 * r) r = h / 2;
                this.beginPath();
                this.moveTo(x + r, y);
                this.arcTo(x + w, y, x + w, y + h, r);
                this.arcTo(x + w, y + h, x, y + h, r);
                this.arcTo(x, y + h, x, y, r);
                this.arcTo(x, y, x + w, y, r);
                this.closePath();
                return this;
            }
        }

        window.onload = function() {
            resize();
            animate();
        };

    </script>
</body>
</html>
